name: Deploy Hire Onboarding to VPS

on:
  push:
    branches: [claude/hire-onboarding-automation-KAVRZ]
    paths:
      - 'hire-onboarding/**'
      - 'deploy/**'
      - '.github/workflows/deploy-hire-onboarding.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            curl -sL https://raw.githubusercontent.com/brandoncheema-ops/Test-Brandon/claude/hire-onboarding-automation-KAVRZ/deploy/setup-vps.sh | bash
