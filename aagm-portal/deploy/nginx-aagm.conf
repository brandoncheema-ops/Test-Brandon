# AAGM Portal - Nginx reverse proxy configuration
# Add this location block inside your brandon.nfapps.ai server block
#
# Example:
#   sudo cp /opt/apps/aagm-portal/deploy/nginx-aagm.conf /etc/nginx/snippets/aagm.conf
#   Then add: include snippets/aagm.conf; inside your server block
#   sudo nginx -t && sudo systemctl reload nginx

location /aagm {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # File uploads up to 50MB
    client_max_body_size 50m;
}

location /aagm/_next/static {
    proxy_pass http://127.0.0.1:3100/aagm/_next/static;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, immutable, max-age=31536000";
}
