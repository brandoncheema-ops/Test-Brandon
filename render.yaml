services:
  - type: web
    name: nf6-property-management
    runtime: node
    buildCommand: cd frontend && npm install && REACT_APP_API_URL=/api npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://nf6-property-management.onrender.com
