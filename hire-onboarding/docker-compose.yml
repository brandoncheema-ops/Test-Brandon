version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hire-postgres
    environment:
      POSTGRES_DB: hire_onboarding
      POSTGRES_USER: hire_user
      POSTGRES_PASSWORD: hire_pass
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hire_user -d hire_onboarding']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hire-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hire-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://hire_user:hire_pass@postgres:5432/hire_onboarding
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars}
      BETA_MODE: 'true'
      BETA_ALLOWED_DOMAINS: balcpa.com
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AUTOMATION_INBOX_EMAIL: ${AUTOMATION_INBOX_EMAIL:-hire-automation@balcpa.com}
      SHAREPOINT_SITE_ID: ${SHAREPOINT_SITE_ID}
      SHAREPOINT_DRIVE_ID: ${SHAREPOINT_DRIVE_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hire-frontend
    ports:
      - '3001:80'
    depends_on:
      - backend

volumes:
  pg_data:
